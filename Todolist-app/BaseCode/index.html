<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo list</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
  </head>
  <body>
    <h1>todos</h1>

    <form id="form">
      <input
        type="text"
        id="input-field"
        placeholder="Enter your task here "
        autocomplete="off"
        ;
      />

      <ul class="todos" id="todos"></ul>
    </form>

    <small>Right-click to delete the task</small>
    <small> Click to complete the task</small>
  </body>
</html>
